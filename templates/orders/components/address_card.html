<section class="checkout-card" aria-labelledby="address-heading">
  <div class="section-heading"><span>2</span><div><h2 id="address-heading">Shipping address</h2><p>Enter the complete address where you want your order delivered.</p></div></div>
  <div class="field">
    <label for="address">Delivery address <span aria-hidden="true">*</span></label>
    <textarea id="address" name="address" rows="4" autocomplete="street-address" required minlength="10" placeholder="House or flat number, street, landmark, city, state and PIN code" aria-describedby="address-help address-error"></textarea>
    <small id="address-help">Include city, state and postal code to help avoid delivery delays.</small>
    <span class="field-error" id="address-error" aria-live="polite"></span>
  </div>
</section>
