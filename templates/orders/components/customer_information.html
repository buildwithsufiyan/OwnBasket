<section class="checkout-card" aria-labelledby="contact-heading">
  <div class="section-heading"><span>1</span><div><h2 id="contact-heading">Customer information</h2><p>We’ll send order updates to these details.</p></div></div>
  <div class="form-grid">
    <div class="field field-full">
      <label for="full-name">Full name <span aria-hidden="true">*</span></label>
      <input id="full-name" name="full_name" type="text" value="{{ request.user.get_full_name }}" autocomplete="name" required minlength="2" placeholder="Your full name" aria-describedby="full-name-error">
      <span class="field-error" id="full-name-error" aria-live="polite"></span>
    </div>
    <div class="field field-full">
      <label for="email">Email address <span aria-hidden="true">*</span></label>
      <input id="email" name="email" type="email" value="{{ request.user.email }}" autocomplete="email" required placeholder="you@example.com" aria-describedby="email-error">
      <span class="field-error" id="email-error" aria-live="polite"></span>
    </div>
  </div>
</section>
