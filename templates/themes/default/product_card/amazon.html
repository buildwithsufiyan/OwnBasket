{% load humanize %}
<div class="product-card h-100 border border-light bg-white rounded-1 p-2 shadow-sm d-flex flex-column justify-content-between hover-amazon">
    <div>
        <div class="text-center p-2" style="height: 150px; display: flex; align-items: center; justify-content: center; background-color: #f7f7f7;">
            <a href="{% url 'products:product_detail' product.slug %}" class="w-100 h-100 d-flex align-items-center justify-content-center">
                {% if product.image %}
                    <img src="{{ product.image.url }}" alt="{{ product.name }}" class="img-fluid" style="max-height: 100%; object-fit: contain;">
                {% else %}
                    <div class="text-muted"><i class="bi bi-box fs-1"></i></div>
                {% endif %}
            </a>
        </div>
        
        <div class="mt-2">
            <h6 class="mb-1 fw-normal" style="font-size: 13px; height: 2.8em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.4;">
                <a href="{% url 'products:product_detail' product.slug %}" class="text-decoration-none text-dark hover-amazon-title">{{ product.name }}</a>
            </h6>
            
            <!-- Amazon gold stars -->
            <div class="d-flex align-items-center gap-1 mb-1">
                <span class="text-warning" style="font-size: 11px;">
                    <i class="bi bi-star-fill"></i>
                    <i class="bi bi-star-fill"></i>
                    <i class="bi bi-star-fill"></i>
                    <i class="bi bi-star-fill"></i>
                    <i class="bi bi-star-half"></i>
                </span>
                <span class="text-info" style="font-size: 11px;">{{ product.reviews_count|default:"12" }}</span>
            </div>
            
            <!-- Prime Badge simulation -->
            <div class="mb-2">
                <span class="badge bg-primary text-white font-monospace" style="font-size: 9px; padding: 2px 4px;">prime</span>
                <span class="text-muted" style="font-size: 10px;">FREE Delivery</span>
            </div>
        </div>
    </div>
    
    <div>
        <div class="d-flex align-items-baseline gap-1 mb-2">
            <span class="text-dark fw-bold fs-5">₹{{ product.display_price|intcomma }}</span>
            {% if product.display_compare_price %}
                <span class="text-muted text-decoration-line-through" style="font-size: 11px;">₹{{ product.display_compare_price|intcomma }}</span>
            {% endif %}
        </div>
        
        <form method="POST" action="{% url 'add_to_cart' product.id %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-warning btn-sm w-100 rounded-pill border-1" style="background-color: #ffd814; border-color: #fcd200; color: #0f1111; font-weight: 500; font-size: 12px; height: 31px; display: flex; align-items: center; justify-content: center;">
                Add to Cart
            </button>
        </form>
    </div>
</div>
<style>
.hover-amazon:hover {
    border-color: #ff9900 !important;
}
.hover-amazon-title:hover {
    color: #c45500 !important;
    text-decoration: underline !important;
}
</style>
