{% load static %}
<div class="border-bottom py-2 bg-light d-none d-lg-block" style="font-size: 13px;">
    <div class="container d-flex justify-content-between align-items-center">
        <span class="text-muted"><i class="bi bi-clock me-1"></i> Support 24/7: info@ownbasket.com</span>
        <div class="d-flex gap-3">
            {% if user.is_authenticated %}
                <a href="{% url 'accounts:profile' %}" class="text-decoration-none text-muted">My Account</a>
                <a href="{% url 'orders:my_orders' %}" class="text-decoration-none text-muted">Track Orders</a>
            {% else %}
                <a href="{% url 'login' %}" class="text-decoration-none text-muted">Login</a>
                <a href="{% url 'register' %}" class="text-decoration-none text-muted">Register</a>
            {% endif %}
        </div>
    </div>
</div>

<header class="py-3 bg-white border-bottom sticky-top shadow-sm">
    <div class="container text-center">
        <!-- Logo -->
        <div class="mb-3">
            <a href="/" class="text-decoration-none fs-2 fw-bold text-dark tracking-tight">
                Own<span class="text-warning">Basket</span>
            </a>
        </div>
        
        <!-- Center Nav Links -->
        <div class="d-flex justify-content-center align-items-center gap-4 mb-2">
            <a href="/" class="text-dark text-decoration-none fw-bold small">Home</a>
            {% for cat in all_categories|slice:":5" %}
                <a href="/home/?category={{ cat.slug }}" class="text-dark text-decoration-none fw-bold small">{{ cat.name }}</a>
            {% endfor %}
            <a href="{% url 'wishlist:wishlist_detail' %}" class="text-dark text-decoration-none fw-bold small">Wishlist</a>
        </div>

        <!-- Search and Action Bar -->
        <div class="row justify-content-center mt-3">
            <div class="col-md-6 col-lg-5">
                <form action="/home/" method="GET" class="input-group">
                    <input type="text" name="q" value="{{ search_query|default:'' }}" class="form-control border-end-0" placeholder="Search products..." aria-label="Search">
                    <button class="btn btn-outline-secondary border-start-0 bg-white text-muted" type="submit">
                        <i class="bi bi-search"></i>
                    </button>
                </form>
            </div>
            <div class="col-auto d-flex align-items-center gap-3">
                <a href="{% url 'cart:cart_detail' %}" class="position-relative text-dark fs-5">
                    <i class="bi bi-bag"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 10px;">
                        {{ cart_count|default:0 }}
                    </span>
                </a>
            </div>
        </div>
    </div>
</header>
