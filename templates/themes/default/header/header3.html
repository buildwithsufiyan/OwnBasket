{% load static %}
<header class="py-3 sticky-top shadow" style="background-color: #121212; border-bottom: 2px solid #d4af37; color: #fff;">
    <div class="container d-flex align-items-center justify-content-between">
        
        <!-- Logo -->
        <a href="/" class="text-decoration-none d-flex align-items-center">
            <span class="fs-2 fw-bold tracking-widest text-uppercase" style="color: #d4af37; font-family: 'Playfair Display', serif; letter-spacing: 2px;">
                OwnBasket
            </span>
        </a>
        
        <!-- Navigation Menu -->
        <nav class="d-none d-md-flex align-items-center gap-4">
            <a href="/" class="text-white text-decoration-none fw-bold small text-uppercase tracking-wider hover-gold">Home</a>
            {% for cat in all_categories|slice:":4" %}
                <a href="/home/?category={{ cat.slug }}" class="text-white text-decoration-none fw-bold small text-uppercase tracking-wider hover-gold">{{ cat.name }}</a>
            {% endfor %}
        </nav>
        
        <!-- Luxury Search & Icons -->
        <div class="d-flex align-items-center gap-3">
            <form action="/home/" method="GET" class="d-none d-lg-flex position-relative">
                <input type="text" name="q" value="{{ search_query|default:'' }}" 
                       class="form-control bg-transparent text-white px-3 py-1 border-gold" 
                       placeholder="Search Luxury..." style="border-radius: 0px; border-color: #d4af37;">
                <button type="submit" class="btn text-white position-absolute end-0 top-0 border-0">
                    <i class="bi bi-search" style="color: #d4af37;"></i>
                </button>
            </form>
            
            <a href="{% url 'wishlist:wishlist_detail' %}" class="text-white position-relative hover-gold">
                <i class="bi bi-heart fs-4"></i>
            </a>

            <a href="{% url 'cart:cart_detail' %}" class="text-white position-relative hover-gold">
                <i class="bi bi-bag-check fs-4"></i>
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill" style="background-color: #d4af37; color: #121212; font-size: 10px;">
                    {{ cart_count|default:0 }}
                </span>
            </a>
            
            {% if user.is_authenticated %}
                <a href="{% url 'accounts:profile' %}" class="text-white hover-gold"><i class="bi bi-person fs-4"></i></a>
            {% else %}
                <a href="{% url 'login' %}" class="text-white small text-uppercase tracking-wider hover-gold">Sign In</a>
            {% endif %}
        </div>
    </div>
</header>
<style>
.border-gold {
    border: 1px solid #d4af37 !important;
}
.hover-gold:hover {
    color: #d4af37 !important;
}
</style>
