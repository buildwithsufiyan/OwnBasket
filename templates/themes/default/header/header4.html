{% load static %}
<div class="bg-danger text-white py-1 text-center small fw-bold">
    <i class="bi bi-lightning-fill me-1"></i> HOT DEALS: UP TO 60% OFF ON SMARTPHONES & ACCESSORIES!
</div>

<header class="py-3 sticky-top bg-dark border-bottom" style="color: #fff; background-color: var(--owncart-secondary) !important;">
    <div class="container">
        <div class="row align-items-center g-3">
            <!-- Brand -->
            <div class="col-lg-3 col-md-4 col-12 d-flex justify-content-between align-items-center">
                <a href="/" class="text-decoration-none fs-3 fw-extrabold text-white d-flex align-items-center">
                    <i class="bi bi-cpu text-info me-2"></i>Own<span class="text-info">Tech</span>
                </a>
                <button class="btn btn-outline-light d-md-none border-0" type="button" data-bs-toggle="collapse" data-bs-target="#techNav">
                    <i class="bi bi-list fs-2"></i>
                </button>
            </div>
            
            <!-- Central Search -->
            <div class="col-lg-6 col-md-5 col-12">
                <form action="/home/" method="GET" class="input-group">
                    <select class="form-select border-0 bg-light text-dark d-none d-md-block" style="max-width: 150px;" name="category">
                        <option value="">All Categories</option>
                        {% for cat in all_categories %}
                            <option value="{{ cat.slug }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                    <input type="text" name="q" value="{{ search_query|default:'' }}" class="form-control border-0" placeholder="Search tech, gadgets..." aria-label="Search">
                    <button class="btn btn-info text-white border-0 px-4" type="submit">
                        <i class="bi bi-search"></i>
                    </button>
                </form>
            </div>
            
            <!-- Right Actions -->
            <div class="col-lg-3 col-md-3 col-12 d-flex justify-content-end align-items-center gap-3">
                <a href="{% url 'wishlist:wishlist_detail' %}" class="text-white text-decoration-none position-relative">
                    <i class="bi bi-heart fs-4"></i>
                </a>
                <a href="{% url 'cart:cart_detail' %}" class="text-white text-decoration-none position-relative d-flex align-items-center gap-2">
                    <div class="position-relative">
                        <i class="bi bi-cart3 fs-4"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-info" style="font-size: 10px;">
                            {{ cart_count|default:0 }}
                        </span>
                    </div>
                    <div class="d-none d-lg-block text-start" style="line-height: 1.1;">
                        <small class="text-muted d-block" style="font-size: 10px;">Your Cart</small>
                        <strong style="font-size: 13px;">View Cart</strong>
                    </div>
                </a>
            </div>
        </div>
        
        <!-- Bottom Category Bar -->
        <div class="collapse navbar-collapse d-md-block mt-3" id="techNav">
            <div class="d-flex flex-wrap gap-3 align-items-center">
                <div class="dropdown">
                    <button class="btn btn-info text-white dropdown-toggle fw-bold" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-grid-fill me-2"></i>Browse Departments
                    </button>
                    <ul class="dropdown-menu">
                        {% for cat in all_categories %}
                            <li><a class="dropdown-menu-item dropdown-item" href="/home/?category={{ cat.slug }}">{{ cat.name }}</a></li>
                        {% endfor %}
                    </ul>
                </div>
                <a href="/" class="text-white text-decoration-none fw-bold small">Home</a>
                <a href="/home/?flash_sale=true" class="text-warning text-decoration-none fw-bold small"><i class="bi bi-lightning-charge-fill"></i> Flash Sales</a>
                {% for brand in all_brands|slice:":3" %}
                    <a href="/home/?brand={{ brand.id }}" class="text-white text-decoration-none small">{{ brand.name }}</a>
                {% endfor %}
            </div>
        </div>
    </div>
</header>
