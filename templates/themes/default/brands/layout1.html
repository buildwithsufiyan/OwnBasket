<section class="py-4 bg-light border-top border-bottom">
    <div class="container text-center">
        <h4 class="mb-4 text-muted small fw-bold text-uppercase tracking-wider">Trusted Brands</h4>
        <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 g-4 justify-content-center align-items-center">
            {% for brand in top_brands %}
            <div class="col d-flex justify-content-center">
                <a href="/home/?brand={{ brand.id }}" class="brand-logo-wrapper opacity-75" style="max-width: 140px; filter: grayscale(100%); transition: all 0.3s ease;">
                    {% if brand.logo %}
                        <img src="{{ brand.logo.url }}" alt="{{ brand.name }}" class="img-fluid" style="max-height: 48px; object-fit: contain;">
                    {% else %}
                        <span class="fs-5 fw-bold text-secondary">{{ brand.name }}</span>
                    {% endif %}
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
<style>
.brand-logo-wrapper:hover {
    opacity: 1 !important;
    filter: grayscale(0%) !important;
    transform: scale(1.05);
}
</style>
