<section class="py-4 bg-white border-bottom overflow-hidden">
    <div class="container-fluid px-0">
        <div class="marquee-track d-flex gap-5 align-items-center" style="animation: scrollBrands 20s linear infinite; width: max-content;">
            <!-- Render twice for infinite loop -->
            {% for brand in top_brands %}
            <div class="brand-item px-3" style="min-width: 150px; text-align: center;">
                <a href="/home/?brand={{ brand.id }}" class="text-decoration-none">
                    {% if brand.logo %}
                        <img src="{{ brand.logo.url }}" alt="{{ brand.name }}" class="img-fluid" style="max-height: 40px; object-fit: contain;">
                    {% else %}
                        <strong class="text-secondary">{{ brand.name }}</strong>
                    {% endif %}
                </a>
            </div>
            {% endfor %}
            {% for brand in top_brands %}
            <div class="brand-item px-3" style="min-width: 150px; text-align: center;">
                <a href="/home/?brand={{ brand.id }}" class="text-decoration-none">
                    {% if brand.logo %}
                        <img src="{{ brand.logo.url }}" alt="{{ brand.name }}" class="img-fluid" style="max-height: 40px; object-fit: contain;">
                    {% else %}
                        <strong class="text-secondary">{{ brand.name }}</strong>
                    {% endif %}
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
<style>
@keyframes scrollBrands {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}
.marquee-track:hover {
    animation-play-state: paused;
}
</style>
