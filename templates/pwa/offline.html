<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffb800">
  <meta name="robots" content="noindex,nofollow">
  <title>OwnBasket is offline</title>
  <style>body{margin:0;background:#f7f7f8;color:#171717;font:16px/1.6 system-ui,sans-serif;display:grid;min-height:100vh;place-items:center}.card{max-width:34rem;margin:1rem;padding:2rem;border-radius:1.25rem;background:#fff;box-shadow:0 1rem 3rem #0001;text-align:center}.mark{display:inline-grid;width:4rem;height:4rem;place-items:center;border-radius:1rem;background:#ffb800;font-size:2rem}button,a{display:inline-block;margin:.5rem;padding:.75rem 1rem;border:0;border-radius:.6rem;background:#171717;color:#fff;text-decoration:none;font:inherit;cursor:pointer}:focus-visible{outline:3px solid #ffb800;outline-offset:3px}</style>
</head>
<body><main class="card" aria-labelledby="offline-title"><div class="mark" aria-hidden="true">🛒</div><h1 id="offline-title">You’re offline</h1><p>OwnBasket cannot reach the network. Public pages you opened earlier may still be available; carts, checkout, accounts and APIs are never served from an offline cache.</p><button type="button" onclick="location.reload()">Try again</button><a href="/home/">Go to cached home</a></main></body>
</html>
